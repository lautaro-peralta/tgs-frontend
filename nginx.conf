# ============================================================================
# NGINX - Sirve el build de Angular y hace de proxy hacia el backend
# ============================================================================

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Compresión para lo que se manda en texto plano.
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/javascript application/json
             image/svg+xml application/manifest+json;

  # El backend vive en la misma red de compose. La app llama a rutas relativas
  # (/api/...), igual que en desarrollo con proxy.conf.json, así que no hace
  # falta CORS ni recompilar para cambiar de entorno.
  location /api/ {
    proxy_pass http://backend:3000/api/;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Las cookies de sesión viajan en estas peticiones.
    proxy_set_header Cookie            $http_cookie;
    proxy_pass_request_headers on;
    proxy_read_timeout 60s;
  }

  # Los artefactos con hash en el nombre no cambian nunca: se cachean fuerte.
  location ~* \.(?:js|css|woff2?|ttf|eot|otf|png|jpe?g|gif|svg|ico|webp)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # index.html sí cambia en cada despliegue: no se cachea, o el navegador
  # seguiría pidiendo los bundles viejos.
  location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
  }

  # Angular resuelve el enrutado en el cliente: cualquier ruta que no sea un
  # fichero real tiene que devolver index.html, o recargar en /mis-compras
  # daría 404.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Cabeceras de seguridad básicas.
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options        "SAMEORIGIN" always;
  add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
}
