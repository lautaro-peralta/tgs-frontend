<section class="auth-card">
  <h2>{{ 'register.title' | translate }}</h2>

  <!-- 🔄 Banner de espera de verificación -->
  <div class="waiting-verification" *ngIf="waitingForVerification() && !loading()" role="status">
    <div class="spinner-small"></div>
    <div class="waiting-content">
      <strong>{{ 'register.waitingVerification' | translate }}</strong>
      <p>{{ 'register.emailSentHint' | translate }}</p>

      <!-- Botón de reenvío con temporizador -->
      <div class="resend-section">
        <button
          type="button"
          class="btn-resend"
          (click)="resendVerificationEmail()"
          [disabled]="!canResend() || resendingEmail()">
          <span *ngIf="resendingEmail()">{{ 'common.sendingEllipsis' | translate }}</span>
          <span *ngIf="!resendingEmail() && !canResend()"><span class="material-symbols-outlined" aria-hidden="true">mail</span> Reenviar email ({{ resendCooldown() }}s)</span>
          <span *ngIf="!resendingEmail() && canResend()">{{ 'login.resendEmail' | translate }}</span>
        </button>
      </div>
    </div>
  </div>

  <!-- ✅ Banner de éxito de registro -->
  <div class="success-message" *ngIf="registrationSuccess() && needsEmailVerification()" role="alert">
    <div class="success-icon"><span class="material-symbols-outlined" aria-hidden="true">check</span></div>
    <div class="success-content">
      <strong>{{ 'register.created' | translate }}</strong>
      <p>{{ 'register.verifyToContinue' | translate }}</p>
    </div>
  </div>

  <form [formGroup]="form" (ngSubmit)="submit()" class="form">
    <label class="label">
      <span>{{ 'register.email' | translate }}</span>
      <input class="input" type="email" formControlName="email" autocomplete="username" />
    </label>
    <label class="label">
      <span>{{ 'register.usernameOptional' | translate }}</span>
      <input class="input" type="text" formControlName="username" />
    </label>
    <label class="label">
      <span>{{ 'login.password' | translate }}</span>
      <input class="input" type="password" formControlName="password" autocomplete="new-password" />
    </label>

    <div class="actions">
      <button class="btn btn-primary" type="submit" [disabled]="loading()">
        {{ loading() ? 'Registrando...' : 'Registrarme' }}
      </button>
    </div>

    <div class="error" *ngIf="error() && !waitingForVerification()">{{ error() }}</div>
  </form>
</section>
