  <!-- Preconnects primero -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <!-- Iconos. `display=block` evita que se vea el nombre del icono en texto
       plano mientras la fuente carga. -->
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block" />
  <!-- Tipografías de la app.
       Sora se usa en h1/h2/h3/.display (rol heading); Inter para body y el
       resto de la UI; JetBrains Mono para IDs/badges/códigos de verificación
       (rol mono, no hereda Inter/Sora). -->
  <link
    href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap"
    rel="stylesheet">
</head>
